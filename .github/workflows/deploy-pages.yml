name: Deploy to GitHub Pages

on:
  push:
    branches: [arena/4bb7d9fd-readymynd]
  workflow_dispatch:

# Allow only one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_STATIC_SITE: 'true'
        run: |
          # GitHub Pages serves files only, so Route Handlers cannot be exported.
          # app/api is moved aside for the build and put straight back afterwards.
          mv app/api app_api_disabled
          npm run build
          mv app_api_disabled app/api

      # Stops GitHub Pages from running Jekyll, which would skip the _next/ folder.
      - name: Disable Jekyll
        run: touch out/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
